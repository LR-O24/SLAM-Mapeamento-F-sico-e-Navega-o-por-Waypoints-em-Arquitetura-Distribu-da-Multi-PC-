# Carregado dentro do namespace do no (~waypoints, ~origin, ...)
# Cada ponto: [x, y, theta] no frame "map" (metros; theta em rad, ou em graus
# com theta_unit: "deg"). Tambem aceito: {x: 1.0, y: 0.5, theta: 0.0}.
# NAO cole a saida do tf_echo inteira: use so x, y da Translation e o yaw (3o valor do RPY).
#
# Arena no maps/arena.yaml (frame map): x de -3.60 a 3.65, y de -1.72 a 1.65.
# Pontos com >= 0.75 m de folga das paredes e obstaculos (raio de giro do robo
# 0.34 m + inflacao). Theta aponta para o proximo ponto. Conferir em campo.
theta_unit: "rad"
waypoints:
  - [2.6, -0.9, 2.30]
  - [1.0, 0.9, 3.14]
  - [-2.2, 0.9, -1.57]
  - [-2.2, -0.25, 0.11]
origin: [0.0, 0.0, 0.0]     # ponto de partida/retorno
spin_mode: "goals"          # "goals" (via move_base) ou "cmd_vel" (por tempo)
spin_speed: 0.5             # rad/s (usado em cmd_vel)
goal_timeout: 120.0
spin_step_timeout: 30.0
