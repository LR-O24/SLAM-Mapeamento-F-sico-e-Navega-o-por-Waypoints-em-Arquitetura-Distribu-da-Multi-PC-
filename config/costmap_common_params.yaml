# Pioneer 3DX medido em 12/11/2026: 45 cm (comprimento) x 38 cm (largura).
# Em relacao ao base_link (centro do eixo das rodas): 17 cm ate a frente (+x),
# 28 cm ate a traseira (-x), 19 cm para cada lado.
footprint: [[-0.28, -0.19], [-0.28, 0.19], [0.17, 0.19], [0.17, -0.19]]

obstacle_layer:
  enabled: true
  obstacle_range: 3.0
  raytrace_range: 4.0
  track_unknown_space: false
  combination_method: 1
  observation_sources: laser_scan
  laser_scan:
    sensor_frame: laser
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    expected_update_rate: 0.5   # LMS291 via RS232 e lento (5-10 Hz)
   

inflation_layer:
  enabled: true
  inflation_radius: 0.40        # arena de 3.5 m: nao exagerar
  cost_scaling_factor: 5.0
